name: Publish npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check tag matches package version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Publishing runs only from a v* tag (got $GITHUB_REF)."; exit 1 ;;
          esac
          node -e "const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); const v = require('./package.json').version; if (v !== tag) { console.error('Tag v' + tag + ' does not match package version ' + v); process.exit(1); }"

      - name: Check version is not already published
        run: |
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "::error::$spec is already on npm. Published versions are immutable: bump the version and tag again."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Publish package
        run: npm publish --access public --provenance
